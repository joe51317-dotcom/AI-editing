[project]
name = "video-use"
version = "0.2.0"
description = "Conversation-driven local video editor skill for Claude Code and Codex"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "fonttools>=4.50",
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
animations = ["manim"]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
